import me.modmuss50.mpp.ReleaseType

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
    id 'idea'
    id "me.modmuss50.mod-publish-plugin" version "0.8.4"
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven { url = "https://cursemaven.com" }
    maven { url = "https://harleyoconnor.com/maven" }
    flatDir {
        dirs rootProject.file("..")
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    clientData {
        arguments.addAll '--mod', project.mod_id, '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources').getAbsolutePath(),
                "--existing-mod", "dynamictrees",
                "--existing-mod", "biomesoplenty"
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

sourceSets.main.java {
    exclude 'com/dtteam/dtbop/DTBOPPlusRegistries.java'
    exclude 'com/dtteam/dtbop/block/GlowShroomCapProperties.java'
    exclude 'com/dtteam/dtbop/tree/GlowshroomSpecies.java'
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    //DynamicTrees
    implementation "com.dtteam.dynamictrees:dynamictrees-neoforge-" + project.minecraft_version + ":" + project.dynamicTreesVersion
    // Dynamic Trees Plus does not have a 26.1.2-compatible jar in this workspace yet.
    // Keep DT+ JSON data guarded by only_if_loaded, but exclude the optional Java glue.
    //implementation "curse.maven:dynamictrees-252818:6111832"

    //DynmaicTrees Tools/Utilities
    runtimeOnly "curse.maven:jade-324717:6011258"
    runtimeOnly "curse.maven:jei-238222:5846880"
    runtimeOnly "curse.maven:cc-tweaked-282001:5714512"
    runtimeOnly "curse.maven:suggestion-provider-fix-469647:5598604"

    //Biomes O Plenty
    implementation "curse.maven:terrablender-940057:6054947"
    implementation "curse.maven:biomes-o-plenty-220318:5855568"
    implementation "curse.maven:glitchcore-955399:5660740"
}

def changelogFile = file("build/changelog.txt")

publishMods {
    file = jar.archiveFile
    displayName = "${mod_name.replace(' ','')}-NeoForge-${minecraft_version} ${project.version}"
    if (changelogFile.exists()) {
        changelog.set(changelogFile.getText())
    }
    type = ReleaseType.of(versionType.toUpperCase())
    modLoaders.add("neoforge")

    curseforge {
        projectId = "289529"
        projectSlug = "dtbop" // Required for discord webhook
        accessToken = findProperty("curseApiKey") ?: System.getenv("CURSEFORGE_API_KEY")
        minecraftVersions.add(minecraft_version)
        requires("dynamictrees")
        requires("biomes-o-plenty")
        optional("dynamictreesplus")
    }
    modrinth {
        projectId = "8QHjGuhP"
        accessToken = findProperty("modrinthToken") ?: System.getenv("MODRINTH_TOKEN")
        minecraftVersions.add(minecraft_version)
        requires("vdjF5PL5") //dt
        requires("HXF82T3G") //bop
        optional("qaO9Dqpu") //dt+
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
